{% extends "base.html" %}
{% block title %}Evelīnas mīļāko varoņu enciklopēdija: Merch{% endblock %}
{% block content %}
<h1>Merch</h1>
<p></p>
<ul>
    {% for product in products %}
    <li>
        <a href="{{url_for('products_show', product_id= product['id'])}}">
            <h3>{{product["name"]}}</h3>
            <img src="{{url_for('static', filename='images/'~product['image'])}}" alt="{{product['name']}}">
        </a>
    </li>
    {% endfor %}
</ul>
{% endblock %}
