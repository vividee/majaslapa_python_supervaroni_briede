{% extends "base.html" %}
{% block title %}Pievieno Atsauksmi{% endblock %}

{% block content %}
<h2>Pievienot atsauksmi</h2>

<form class="review-card" action="/addreview" method="POST">

    <label>Nosaukums: </label><br>
    <input type="text" name="title" required><br><br>

    <label>Varonis: </label><br>    
    <select name="hero_id" required>
    {% for hero in heroes %}
        <option value="{{ hero.id }}">{{ hero.hero_name }}</option>
    {% endfor %}
    </select><br><br>

    <label>Atsauksme:</label><br>
    <textarea name="review_text" required></textarea><br><br>

    <label>Vērtējums (1-5):</label><br>
    <input type="number" name="rating" min="1" max="5" required><br><br>

    <button type="submit">Saglabāt</button>

</form>

<a href="/reviews">⬅ Atpakaļ</a>
{% endblock %}
